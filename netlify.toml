[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'no build step - static site'"

[functions]
  node_bundler = "esbuild"

# Friendly /api/* paths that map to the serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Clean URLs for the public policy pages, which Twilio's campaign
# registration requires as links.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/sms-terms"
  to = "/sms-terms.html"
  status = 200

[[redirects]]
  from = "/sms-consent-form"
  to = "/sms-consent-form.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Cache-Control = "no-store"

[[headers]]
  for = "/privacy*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sms-terms*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sms-consent-form*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
